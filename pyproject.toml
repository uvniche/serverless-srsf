[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-srsf"
version = "0.2.0"
description = "Deployable serverless document pipeline with SSRSF control contracts"
requires-python = ">=3.11"
dependencies = ["pypdf>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

